name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify VERSION matches release tag
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${{ github.event.release.tag_name }}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::VERSION file ($VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract WSE libs from wowza-streaming-engine image
        run: |
          mkdir -p wse-lib
          docker run --rm \
            -v "$(pwd)/wse-lib:/output" \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            wowza/wowza-streaming-engine:latest-slim \
            -c 'cp /usr/local/WowzaStreamingEngine/lib.default/*.jar /output/'
          echo "Extracted $(ls -1 wse-lib/*.jar | wc -l | xargs) WSE JAR files"

      - name: Build & test
        run: ./gradlew build -PwseLibDir=./wse-lib --no-daemon

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar --clobber
