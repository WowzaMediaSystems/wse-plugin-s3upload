import java.util.concurrent.Callable

plugins {
    id 'java-library'
    id 'com.gorylenko.gradle-git-properties' version '2.5.2'
}

group 'com.wowza.wms.plugin.s3upload'

Closure<String> resolveReleaseVersion = {
    if (!project.ext.has('gitProps')) return 'unspecified'
    String tags = project.ext.gitProps['git.tags'] as String
    if (!tags) return 'unspecified'
    return tags.split(',').find { it.matches(/\d+\.\d+\.\d+/) } ?: 'unspecified'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: "$wseLibDir", include: '*.jar')
    compileOnly 'org.apache.logging.log4j:log4j-core:2.25.4'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.25.4'
    implementation('com.amazonaws:aws-java-sdk-s3:1.12.797') {
        // Not needed at runtime by this module (verified with jdeps): kms is
        // only used by the S3 client-side encryption client, jmespath and
        // cbor only by SDK code paths S3 doesn't use
        exclude group: 'com.amazonaws', module: 'aws-java-sdk-kms'
        exclude group: 'com.amazonaws', module: 'jmespath-java'
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-cbor'
    }
    testCompileOnly fileTree(dir: "$wseLibDir", include: '*.jar')
}

gitProperties {
    extProperty = 'gitProps'
    dateFormat = "yyyy-MM-dd'T'HH:mm:ss'Z'"
    dateFormatTimeZone = 'UTC'
}

generateGitProperties.outputs.upToDateWhen { false }

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', layout.buildDirectory.dir('generated/java')]
        }
    }
}

tasks.register('generateReleaseInfo') {
    dependsOn generateGitProperties
    group = "build"
    def outputDir = layout.buildDirectory.dir('generated/java') as Provider<Directory>
    def packageDotPath = "${project.group}"
    def packagePath = packageDotPath.replaceAll('\\.', '/')
    def projectVersion = "${project.version}"
    def projectNameProp = "${projectName}"

    outputs.dir outputDir.get().dir(packagePath)
    doLast {
        Directory dir = outputDir.get().dir(packagePath)
        dir.asFile.mkdirs()
        dir.file("ReleaseInfo.java").asFile.text =
                """|package $packageDotPath;
                   |public class ReleaseInfo {
                   |    public static String getProject() { return "${projectNameProp}"; }
                   |    public static String getVersion() { return "${resolveReleaseVersion()}"; }
                   |    public static String getBuildComitDate() { return "${-> project.ext.gitProps['git.commit.time']}"; }
                   |    public static String getBuildNumber() { return "${-> project.ext.gitProps['git.commit.id.abbrev']}"; }
                   |}""".stripMargin()
    }
}

clean.finalizedBy generateReleaseInfo
compileJava.dependsOn generateReleaseInfo

// Copy runtime dependencies alongside the plugin jar, skipping any jar that
// Wowza Streaming Engine already ships in its lib folder (matched by module
// name with the version suffix stripped).
tasks.register('copyDeps', Sync) {
    def stripVersion = { String name -> name.replaceAll(/\.jar$/, '').replaceAll(/-\d.*$/, '') }
    def wseModules = provider {
        fileTree(dir: "$wseLibDir", include: '*.jar').files.collect { stripVersion(it.name) } as Set
    }
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs')
    exclude { element -> !element.directory && wseModules.get().contains(stripVersion(element.name)) }
}

tasks.withType(Jar).configureEach {
    dependsOn generateGitProperties, copyDeps
    archiveVersion.set(project.provider({ resolveReleaseVersion() } as Callable<String>))
    manifest {
        attributes(
                'Gradle-Version'        : "Gradle ${gradle.gradleVersion}",
                'Created-By'      		: "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Name'                  : "${project.name}",
                'Build-Version'	        : "${-> resolveReleaseVersion()}",
                'Build-Timestamp'    	: "${-> project.ext.gitProps['git.commit.time']}",
                'Build-Revision'        : "${-> project.ext.gitProps['git.commit.id.abbrev']}",
        )
    }
    exclude('git.properties')
    metaInf {
        from files('LICENSE.txt')
    }
    archiveBaseName = 'wse-plugin-' + projectName
}

tasks.named('jar').configure {
    doFirst {
        if (project.hasProperty('release') && resolveReleaseVersion() == 'unspecified') {
            throw new GradleException(
                    "Release build requires a *.*.* tag on HEAD; git.tags='${project.ext.gitProps?.get('git.tags') ?: ''}'"
            )
        }
    }
}

test {
    useJUnitPlatform()
}
